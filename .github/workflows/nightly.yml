name: nightly-pipeline

on:
  schedule:
    # 23:30 UTC Mon–Fri — after US close in both DST regimes (trap #5:
    # Actions cron is UTC-only and can be delayed at popular times).
    - cron: "30 23 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Secrets live in the "prod" environment (repo → Settings → Environments).
    environment: prod
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore pipeline cache
        uses: actions/cache@v4
        with:
          # .cache = EDGAR docs (re-derivable, trap #12 — cache, never storage)
          # out/analyses + out/state = analysis cache, cooldown, feedback, offsets
          path: |
            .cache
            out/analyses
            out/state
          key: pipeline-${{ github.run_id }}
          restore-keys: |
            pipeline-

      - run: npm ci

      - run: npm test

      - name: Run pipeline
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run pipeline

      - name: Notify failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="⚠ Pipeline failed — run ${{ github.run_id }} (${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
